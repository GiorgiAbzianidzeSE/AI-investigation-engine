[project]
name = "ai-investigation-engine"
version = "0.1.0"
description = "Evidence-grounded multi-document investigation engine (hybrid search + agentic RAG)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "openai>=1.50",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.7"]
corpus = ["pyarrow>=16", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
